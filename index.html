<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トーク英作</title>
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #EDF0F5;
  --surface: #FFFFFF;
  --ink: #1B2232;
  --muted: #5F6B80;
  --line: #D5DBE5;
  --me: #3445A5;
  --on-me: #FFFFFF;
  --me-soft: #E1E6FA;
  --ok: #1E8758;
  --close: #A86A12;
  --ng: #C23A2E;
  --ok-soft: #DDF2E7;
  --close-soft: #F7EBD6;
  --ng-soft: #F8E0DD;
  --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #11141D; --surface: #1A1F2C; --ink: #E6E9F1; --muted: #9AA3B5; --line: #2A3142;
    --me: #4B5FD0; --on-me: #FFFFFF; --me-soft: #252E52;
    --ok: #4CC08B; --close: #E0A84A; --ng: #F07A6E;
    --ok-soft: #173327; --close-soft: #3A2C15; --ng-soft: #3D1D1A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #11141D; --surface: #1A1F2C; --ink: #E6E9F1; --muted: #9AA3B5; --line: #2A3142;
  --me: #4B5FD0; --on-me: #FFFFFF; --me-soft: #252E52;
  --ok: #4CC08B; --close: #E0A84A; --ng: #F07A6E;
  --ok-soft: #173327; --close-soft: #3A2C15; --ng-soft: #3D1D1A;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.7; -webkit-tap-highlight-color: transparent; }
#app { max-width: 560px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
.view { flex: 1; display: flex; flex-direction: column; padding: 0 16px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--me); outline-offset: 2px; }
img, svg { max-width: 100%; }
a { color: var(--me); }

/* top bar */
.bar { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.bar h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: .02em; flex: 1; }
.bar .grow { flex: 1; }
.link { background: none; border: 0; padding: 8px 10px; border-radius: 10px; color: var(--me); font-weight: 500; }
.link:active { background: var(--me-soft); }

/* chat */
.date-chip { align-self: center; margin: 8px 0 4px; padding: 2px 12px; border-radius: 999px; background: var(--line); color: var(--muted); font-size: .8125rem; }
.row { display: flex; flex-direction: column; margin: 10px 0; }
.row.me { align-items: flex-end; }
.row.them { align-items: flex-start; }
.who { font-size: .8125rem; color: var(--muted); margin: 0 0 2px 6px; }
.bubble { max-width: 84%; padding: 10px 14px; border-radius: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.them { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.bubble.mine { background: var(--me); color: var(--on-me); border-bottom-right-radius: 6px; font-size: 1.125rem; font-weight: 500; line-height: 1.6; }
.bubble.en { background: var(--me-soft); font-family: var(--serif); font-size: 1.1875rem; line-height: 1.45; border-bottom-right-radius: 6px; }
.under { font-size: .8125rem; color: var(--muted); margin: 4px 6px 0; }
.coach { width: 100%; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; border-bottom-left-radius: 6px; padding: 14px 16px 16px; }
.coach p { margin: 0; }
.coach .sec { margin-top: 14px; }
.coach .lbl { font-size: .8125rem; color: var(--muted); margin-bottom: 2px; }
.en-line { display: flex; align-items: flex-start; gap: 10px; }
.en-line .txt { flex: 1; font-family: var(--serif); }
.model { font-size: 1.4375rem; line-height: 1.35; font-weight: 500; }
.alt { font-size: 1.125rem; line-height: 1.4; }
.alt + .alt { margin-top: 6px; }
.phrase { font-family: var(--serif); font-style: italic; font-size: 1.0625rem; }
.verdict { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 2px 12px; border-radius: 999px; font-size: .9375rem; }
.verdict.correct { color: var(--ok); background: var(--ok-soft); }
.verdict.close { color: var(--close); background: var(--close-soft); }
.verdict.wrong { color: var(--ng); background: var(--ng-soft); }
.typing { display: inline-flex; gap: 5px; align-items: center; height: 24px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* round icon buttons */
.icon-btn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--me); display: grid; place-items: center; padding: 0; }
.icon-btn:active { background: var(--me-soft); }
.icon-btn svg { width: 20px; height: 20px; }

/* composer */
.composer { position: sticky; bottom: 0; margin: 12px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.ask-row { display: flex; gap: 10px; align-items: flex-end; }
.ask-row textarea { flex: 1; min-height: 52px; max-height: 9em; resize: none; padding: 13px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-family: var(--serif); font-size: 1.125rem; line-height: 1.4; }
.ask-row textarea::placeholder { font-family: var(--sans); font-size: .9375rem; color: var(--muted); }
.mic { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--me); background: var(--surface); color: var(--me); display: grid; place-items: center; padding: 0; position: relative; }
.mic svg { width: 24px; height: 24px; }
.mic.on { background: var(--ng); border-color: var(--ng); color: #fff; }
.mic.on::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--ng); animation: ring 1.4s infinite ease-out; }
@keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
.btn-row { display: flex; gap: 10px; margin-top: 10px; }
.btn { min-height: 52px; border-radius: 14px; border: 0; padding: 0 18px; font-weight: 700; font-size: 1rem; }
.btn.primary { background: var(--me); color: var(--on-me); }
.btn-row .btn.primary { flex: 1; }
.btn.primary:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--me); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.hint { font-size: .8125rem; color: var(--muted); margin: 8px 2px 0; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: .9375rem; }
.seg button[aria-pressed="true"].correct { background: var(--ok); border-color: var(--ok); color: #fff; }
.seg button[aria-pressed="true"].close { background: var(--close); border-color: var(--close); color: #fff; }
.seg button[aria-pressed="true"].wrong { background: var(--ng); border-color: var(--ng); color: #fff; }
.seg button[aria-pressed="true"].plain { background: var(--me); border-color: var(--me); color: var(--on-me); }
.next-due { font-size: .875rem; color: var(--muted); margin: 8px 2px 0; }
.natural { margin-top: 14px; padding: 10px 12px 12px; border-radius: 14px; background: var(--me-soft); }
.natural .txt { font-family: var(--serif); font-size: 1.25rem; line-height: 1.4; font-weight: 500; }
.coach .natural .why { font-size: .875rem; margin-top: 6px; }
.coach .already { margin-top: 10px; font-size: .875rem; color: var(--ok); }

/* quiz header */
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 0 0 4px; }
.progress span { display: block; height: 100%; background: var(--me); transition: width .3s; }
.count { font-size: .875rem; color: var(--muted); }
.kind { font-size: .8125rem; padding: 1px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.thread { flex: 1; display: flex; flex-direction: column; padding-bottom: 8px; }

/* home */
section { padding: 20px 0; border-top: 1px solid var(--line); }
section h2 { margin: 0 0 12px; font-size: 1rem; font-weight: 700; }
.item { padding: 12px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .ja { font-size: .9375rem; color: var(--muted); white-space: pre-wrap; }
.item .meta { font-size: .8125rem; color: var(--muted); margin-top: 4px; }
.item .en-line .txt { font-size: 1.1875rem; line-height: 1.4; }
.note { font-size: .875rem; color: var(--muted); }
.banner { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--close-soft); color: var(--ink); font-size: .9375rem; }
.foot { padding: 16px 0 28px; font-size: .8125rem; color: var(--muted); }
.empty { padding: 28px 0; color: var(--muted); }

/* setup */
.intro { padding: 28px 0 8px; }
.intro .title { font-size: 2rem; font-weight: 700; line-height: 1.3; margin: 0 0 10px; color: var(--ink); }
.intro p { margin: 0; color: var(--muted); }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
ol.steps li { counter-increment: s; position: relative; padding: 0 0 16px 40px; }
ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--me-soft); color: var(--me); font-weight: 700; display: grid; place-items: center; font-size: .875rem; }
.file-btn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.file-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.file-help { font-size: .8125rem; color: var(--muted); margin: 10px 2px 0; }
label.field { display: block; margin: 0 0 6px; font-weight: 500; }
select, .text-in { width: 100%; min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.row-set { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch { width: 52px; height: 32px; border-radius: 999px; border: 0; background: var(--line); position: relative; padding: 0; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--me); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
input[type="range"] { width: 100%; accent-color: var(--me); }
.danger, .btn.danger { color: var(--ng); }

.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(520px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: .9375rem; z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .typing i, .mic.on::after { animation: none; }
  .progress span, .switch::after { transition: none; }
}
/* ---- v3: 定着度ドット ---- */
:root {
  --l1: #D3D9F4; --l1-ring: #8F9BD6; --l2: #A3B0EA; --l3: #7184D8; --l4: #4557BF; --l5: #232F86;
  --plan-ring: #8A94AA; --row-hi: #F3F5FC; --line-soft: #EEF1F5; --ctx-me: #E6E9F0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --l1: #2B3359; --l1-ring: #5A67A8; --l2: #3B4BA0; --l3: #5468D4; --l4: #7D90F0; --l5: #B5C2FF;
    --plan-ring: #77819A; --row-hi: #222A40; --line-soft: #242B3B; --ctx-me: #262D3D;
  }
}
:root[data-theme="dark"] {
  --l1: #2B3359; --l1-ring: #5A67A8; --l2: #3B4BA0; --l3: #5468D4; --l4: #7D90F0; --l5: #B5C2FF;
  --plan-ring: #77819A; --row-hi: #222A40; --line-soft: #242B3B; --ctx-me: #262D3D;
}
.dot { display: inline-block; flex: none; width: 5px; height: 5px; border-radius: 50%; }
.dot.l1 { background: var(--l1); box-shadow: inset 0 0 0 1px var(--l1-ring); }
.dot.l2 { background: var(--l2); }
.dot.l3 { background: var(--l3); }
.dot.l4 { background: var(--l4); }
.dot.l5 { background: var(--l5); }
.dot.plan { background: transparent; box-shadow: inset 0 0 0 1.25px var(--plan-ring); }
.dot.s9 { width: 9px; height: 9px; }
.dot.s10 { width: 10px; height: 10px; }
.dot.s12 { width: 12px; height: 12px; }
.dot.m { width: 14px; height: 14px; }
.dot.m.plan, .dot.s9.plan, .dot.s12.plan { box-shadow: inset 0 0 0 1.5px var(--plan-ring); }

/* ---- ホーム ---- */
.todayrow { display: flex; align-items: center; gap: 12px; padding: 6px 0 16px; }
.todayrow .info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.todayrow .lbl { font-size: .8125rem; color: var(--muted); }
.todayrow .num { font-size: 1.0625rem; }
.todayrow .num b { font-size: 1.625rem; font-weight: 700; }
.todayrow .num small { font-size: .8125rem; color: var(--muted); }
.todayrow .btn { padding: 0 26px; }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px 10px 14px; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; margin-top: 12px; }
.zseg { display: flex; gap: 4px; background: var(--bg); border-radius: 12px; padding: 3px; }
.zseg button { flex: 1; height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: .9375rem; font-weight: 500; }
.zseg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(27, 34, 50, .12); }
.cal-head { display: flex; align-items: center; padding: 0 2px; }
.cal-head .ttl { flex: 1; font-size: 1.125rem; font-weight: 700; padding-left: 6px; }
.cal-head .ttl small { font-size: .8125rem; font-weight: 500; color: var(--me); margin-left: 6px; }
.nav-btn { width: 44px; height: 44px; border: 0; background: none; color: var(--me); display: grid; place-items: center; padding: 0; border-radius: 12px; }
.nav-btn:active { background: var(--me-soft); }
.nav-btn svg { width: 20px; height: 20px; }
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0 2px; font-size: .75rem; color: var(--muted); text-align: center; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px 2px; }
.mcell { height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 2px 0 0; border-radius: 12px; border: 0; background: transparent; min-width: 0; }
.mcell.sel { background: var(--me-soft); }
.mcell .num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .8125rem; font-variant-numeric: tabular-nums; }
.mcell.today .num { background: var(--me); color: var(--on-me); font-weight: 700; }
.mcell.future .num { color: var(--muted); }
.mcell.sel .num { font-weight: 700; }
.mdots { display: grid; grid-template-columns: repeat(6, 5px); gap: 2px; justify-content: center; }
.more { font-size: 9px; line-height: 1; color: var(--muted); height: 9px; }
.legend { display: flex; align-items: center; gap: 6px; padding: 10px 6px 0; border-top: 1px solid var(--line-soft); font-size: .75rem; color: var(--muted); flex-wrap: wrap; }
.legend .ramp { display: flex; gap: 4px; }
.legend .plan-key { margin-left: auto; display: flex; align-items: center; gap: 5px; }
.msum { display: flex; flex-direction: column; gap: 8px; padding: 16px 4px 0; }
.msum .row1 { display: flex; align-items: baseline; gap: 8px; }
.msum .row1 b { font-size: 1rem; }
.msum .row1 span { font-size: .875rem; color: var(--muted); }
.msum .dots { display: flex; gap: 6px; flex-wrap: wrap; }
.wrow { padding: 12px 8px; border-radius: 14px; border-bottom: 1px solid var(--line-soft); }
.wrow:last-child { border-bottom: 0; }
.wrow.open { background: var(--row-hi); }
.wline { display: flex; gap: 12px; align-items: flex-start; }
.wlab { width: 52px; flex: none; display: flex; flex-direction: column; }
.wnum { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 4px; }
.wnum.today { color: var(--me); }
.wnum.future { color: var(--muted); }
.wwd, .wcount { font-size: .75rem; color: var(--muted); }
.wdots { flex: 1; display: flex; flex-wrap: wrap; gap: 0; padding-top: 3px; min-width: 0; }
.wdot { width: 20px; height: 20px; padding: 0; border: 0; background: none; display: grid; place-items: center; border-radius: 50%; }
.wdot.picked .dot { outline: 2px solid var(--ink); outline-offset: 2px; }
.pop { position: relative; margin: 12px 0 2px 64px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 12px 8px 14px; box-shadow: 0 6px 20px rgba(27, 34, 50, .12); display: flex; flex-direction: column; gap: 6px; }
.pop-meta { display: flex; align-items: center; gap: 4px 6px; font-size: .75rem; color: var(--muted); flex-wrap: wrap; }
.pop-meta span { white-space: nowrap; }
.pop-meta .grow { flex: 1; }
.pop-ja { font-size: .9375rem; line-height: 1.6; white-space: pre-wrap; }
.pop .en-line .txt { font-size: 1.125rem; line-height: 1.35; font-weight: 500; }
.dsum { display: flex; flex-direction: column; gap: 8px; padding: 0 8px 6px; }
.dbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; }
.dbar span { min-width: 4px; }
.dbar .b1 { background: var(--l1); box-shadow: inset 0 0 0 1px var(--l1-ring); }
.dbar .b2 { background: var(--l2); } .dbar .b3 { background: var(--l3); } .dbar .b4 { background: var(--l4); } .dbar .b5 { background: var(--l5); }
.dgroup { display: flex; align-items: center; gap: 8px; padding: 12px 8px 4px; font-size: .8125rem; font-weight: 700; }
.dgroup span:last-child { font-weight: 400; color: var(--muted); }
.ditem { display: flex; gap: 10px; align-items: center; padding: 10px 8px 12px; border-bottom: 1px solid var(--line-soft); }
.ditem .body { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ditem .ja { font-size: .9375rem; line-height: 1.5; white-space: pre-wrap; }
.ditem .en { font-family: var(--serif); font-size: 1.0625rem; line-height: 1.35; font-weight: 500; }
.ditem .meta { font-size: .75rem; color: var(--muted); }
.cal-empty { margin: 8px; color: var(--muted); font-size: .9375rem; }
.loading { padding: 40vh 0 0; text-align: center; color: var(--muted); }

/* ---- 出題画面の文脈 ---- */
.bubble.ctxme { background: var(--ctx-me); color: var(--ink); border-bottom-right-radius: 6px; font-size: .9375rem; }
.bubble.them.small { font-size: .9375rem; }
.after-ctx { align-self: flex-start; font-size: .8125rem; color: var(--muted); margin: 2px 6px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ 基本ユーティリティ ============ */
const DAY = 86400000;
const pad2 = n => String(n).padStart(2, "0");
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (day, n) => { const d = new Date(day); d.setDate(d.getDate() + n); return startOfDay(d); };
const len = s => Array.from(s).length;
const WD = ["日", "月", "火", "水", "木", "金", "土"];

  const cand = studied.filter(c => !dueIds.has(c.id) && !seen.has(c.id) && now - c.last > DAY / 2);
  const nProbe = extraNew ? 0 : Math.min(cand.length, Math.round(exploreShare() * Math.max(5, due.length + fresh.length)));
  const probes = sampleN(cand, nProbe);
  const reviews = due.map(c => c.id);
  for (const p of probes) reviews.splice(Math.floor(Math.random() * (reviews.length + 1)), 0, p.id);
  return { reviews, probes: new Set(probes.map(p => p.id)), fresh };

// 発音しない要素（lol・haha・絵文字・顔文字など）を取り除く
function speakable(s) {
  if (!s) return s;
  let t = String(s)
    .replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, "")
    .replace(/(^|\s)[:;=xX8][-^']?[)(DPpO3\]\[\/\\|*]+(?=$|\s|[.,!?])/g, "$1")
    .replace(/(^|[\s(])\(?(?:lol+|lmao+|lmfao|rofl|ha(?:ha)+h?|he(?:he)+|ha(?: ha)+|xd)\)?(?=$|[\s.,!?)])/gi, "$1")
    .replace(/(^|\s)[wｗ]{2,}(?=$|\s)/g, "$1")
    .replace(/\(\s*\)/g, "")
    .replace(/\s+([.,!?])/g, "$1")
    .replace(/,\s*([.!?])/g, "$1")
    .replace(/^[\s,.;:!]+/, "")
    .replace(/[\s,;:]+$/, "")
    .replace(/\s{2,}/g, " ")
    .trim();
  if (!t) return String(s).trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
}

const MODELS = { "claude-haiku-5-5": "Claude Haiku 5.5（速い・安い）", "claude-sonnet-5-5": "Claude Sonnet 5.5（より丁寧）" };
async function callClaude(prompt, maxTokens = 2000) {

    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: MODELS[S.settings.model] ? S.settings.model : "claude-haiku-5-5", max_tokens: maxTokens, output_config: { effort: "low" }, messages: [{ role: "user", content: prompt }] })

  } catch { throw { code: navigator.onLine === false ? "offline" : "network" }; }

  try { data = await res.json(); } catch {}

    if (res.status === 403) throw { code: "permission" };
    if (res.status === 429) throw { code: "rate_limited" };

    throw { code: "upstream_error" };

  if (data && data.stop_reason === "refusal") throw { code: "refused" };
  const text = ((data && data.content) || []).filter(b => b.type === "text").map(b => b.text).join("");
  const t = text.replace(/```(?:json)?/g, "").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b <= a) throw { code: "invalid_json" };
  try { return JSON.parse(t.slice(a, b + 1)); } catch { throw { code: "invalid_json" }; }
}
function contextBlock(item) {
  if (!S.settings.sendContext) return "";

  if (!cx.before.length && !cx.after.length) return "";
  const labels = new Map();
  const lab = m => {
    if (m.me) return "Me";
    if (!labels.has(m.name)) labels.set(m.name, labels.size === 0 ? "Friend" : "Friend " + String.fromCharCode(66 + labels.size - 1));
    return labels.get(m.name);
  };
  const lines = [...cx.before.map(m => lab(m) + ": " + m.text), ">>> Me: " + item.ja + "    <- THE MESSAGE TO WORK ON", ...cx.after.map(m => lab(m) + ": " + m.text)];
  return "This message comes from a LINE chat ([写真] = a photo, [スタンプ] = a sticker). The surrounding messages are for understanding only; do not translate them:\n<<<\n" + lines.join("\n") + "\n>>>\nUse this context to get pronouns, tense, tone and implied meaning right. The English must make sense as the message at that point in this conversation.\n\n";
}
function buildPrompt(item, answer, ref) {

/* ============ セッション ============ */
function startSession(plan) {
  const p = plan || makePlan();
  const fresh = new Map(p.fresh.map(it => [it.id, it]));
  const queue = [...p.reviews, ...p.fresh.map(it => it.id)];
  if (!queue.length) return;
  S.session = { queue, fresh, probes: p.probes || new Set(), total: queue.length, seen: {}, first: {}, missed: [], phase: "ask", cur: null, answer: "", result: null, lesson: null, error: null, kind: "" };
  nextQuestion();
}
function newCard(item) {
  return { id: item.id, ja: item.ja, d: item.d || null, src: item.src || null, mi: item.mi ?? null, ctx: item.ctx || null, cn: item.cn || null,
    en: null, alts: [], tip: null, ph: null, phj: null, created: Date.now(), S: null, last: 0, lapses: 0, ans: null };
}
const baseCard = id => S.cards[id] || newCard(S.session.fresh.get(id) || S.poolIndex.get(id));
function nextQuestion() {
  const ss = S.session;
  if (!ss.queue.length) { S.view = "done"; render(); scheduleRefit(); return; }
  const id = ss.queue.shift();
  ss.kind = ss.seen[id] ? "again" : !S.cards[id] ? "new" : ss.probes.has(id) ? "probe" : "review";
  ss.seen[id] = (ss.seen[id] || 0) + 1;
  Object.assign(ss, { cur: id, phase: ss.kind === "new" ? "learn-loading" : "ask", answer: "", result: null, lesson: null, error: null, giveUp: false });
  S.view = "quiz"; render(); window.scrollTo(0, 0);
  if (ss.kind === "new") loadLesson();
  prefetchNext();
}
const lessons = new Map();
function lessonFor(item) {
  const key = item.id + ":" + levelKey() + (S.settings.sendContext ? ":c" : "");
  if (!lessons.has(key)) lessons.set(key, teach(item).catch(e => { lessons.delete(key); throw e; }));
  return lessons.get(key);
}
// 飛ばしたときに待たないよう、この先2問分の新しい表現を先に用意する
function prefetchNext() {
  const ss = S.session;
  if (!ss) return;
  for (const nid of ss.queue.slice(0, 3).filter(id => !S.cards[id] && !ss.seen[id]).slice(0, 2)) {
    const it = ss.fresh.get(nid);
    if (it) lessonFor(it).catch(() => {});
  }
}
// Claudeが「問題にしない」と判定したら、何も表示せずに代わりの問題を1つ入れて次へ進む
function skipCurrent() {
  const ss = S.session, id = ss.cur;
  skippedNow.add(id);
  delete ss.seen[id];
  ss.skipped = (ss.skipped || 0) + 1;
  let rep = null;
  if (ss.skipped <= 20) {
    const used = new Set([...ss.queue, ...Object.keys(ss.seen), ...ss.fresh.keys()]);
    rep = pickFresh(10).find(x => !used.has(x.id)) || null;
  }
  if (rep) { ss.fresh.set(rep.id, rep); ss.queue.unshift(rep.id); }
  else ss.total = Math.max(Object.keys(ss.seen).length, ss.total - 1);
  S.plan = null;
  nextQuestion();
}
async function loadLesson() {
  const ss = S.session, id = ss.cur, base = baseCard(id);
  ss.phase = "learn-loading"; ss.error = null; render();
  try {
    const res = await lessonFor(base);
    if (S.session !== ss || ss.cur !== id) return;
    if (res.skip) { skipCurrent(); return; }
    ss.lesson = { ...base, en: res.model, alts: res.alts, tip: res.point, ph: res.phrase, phj: res.phrase_ja };
    ss.phase = "learn"; render(); scrollToEnd();
    if (S.settings.autoSpeak) TTS.speak(res.model, true);
  } catch (e) {
    if (S.session !== ss || ss.cur !== id) return;
    ss.phase = "error"; ss.error = (e && e.code) || "upstream_error"; render(); scrollToEnd();

// 「覚えた」：あなたの記憶モデルが「90%を下回る」と見積もった頃に初出題
function learned() {
  const ss = S.session, c0 = ss && ss.lesson;
  if (!c0) return;
  const now = Date.now(), ev = { id: c0.id, t: now, k: "learn" };
  const st = step(null, ev, S.mem);
  const c = { ...c0, created: now, S: st.S, last: st.last, lapses: 0 };
  S.cards[c.id] = c; S.log.push(ev); saveCards(); saveLog();
  if (!ss.first[c.id]) ss.first[c.id] = "learned";
  ss.lesson = null;
}
async function check(giveUp) {
  const ss = S.session, id = ss.cur, base = baseCard(id);
  const answer = giveUp ? "" : ss.answer.trim();
  if (!giveUp && !answer) return;
  stopListening();
  ss.giveUp = giveUp; ss.shown = answer; ss.phase = "grading"; ss.error = null;
  render(); scrollToEnd();
  if (giveUp && base.en) { reveal(base, { model: base.en, alts: base.alts, verdict: "wrong", feedback: "", phrase: base.ph, phrase_ja: base.phj }); return; }
  try {
    const res = await grade(base, answer, base.en);
    if (S.session !== ss || ss.cur !== id) return;
    reveal(base, res);
  } catch (e) {
    if (S.session !== ss || ss.cur !== id) return;
    ss.phase = "error"; ss.error = (e && e.code) || "upstream_error"; render(); scrollToEnd();
  }
}
function reveal(base, res) {
  const ss = S.session;
  const verdict = ss.giveUp ? "wrong" : res.verdict;
  const card = { ...base, en: res.model || base.en, alts: res.alts && res.alts.length ? res.alts : base.alts || [],
    tip: res.feedback || base.tip, ph: res.phrase || base.ph, phj: res.phrase_ja || base.phj, ans: ss.giveUp ? null : ss.shown };
  const now = Date.now(), st = stateOf(card);
  const opt = k => step(st, { id: card.id, t: now, k }, S.mem);
  ss.result = { res, card, now, chosen: verdict, auto: verdict, options: { correct: opt("correct"), close: opt("close"), wrong: opt("wrong") } };

function commit() {
  const ss = S.session, r = ss && ss.result;

  const c = r.card, st = stateOf(c);
  const ev = { id: c.id, t: r.now, k: r.chosen };
  if (st) { ev.p = Math.round(R((r.now - st.last) / DAY, st.S) * 1000) / 1000; ev.dt = Math.round((r.now - st.last) / DAY * 100) / 100; }
  const ns = step(st, ev, S.mem);
  const final = { ...c, S: ns.S, last: ns.last, lapses: ns.lapses };
  S.cards[final.id] = final; S.log.push(ev); saveCards(); saveLog();
  if (!ss.first[final.id]) ss.first[final.id] = r.chosen;
  if (r.chosen === "wrong") {
    if (!ss.missed.includes(final.id)) ss.missed.push(final.id);
    if (ss.seen[final.id] < 3) ss.queue.splice(Math.min(3, ss.queue.length), 0, final.id);

function quit() {
  stopListening();
  if (S.session && S.session.phase === "result") commit();
  const hadAny = S.session && Object.keys(S.session.first).length;
  S.view = hadAny ? "done" : "home";
  if (!hadAny) { S.session = null; S.plan = null; }
  render(); scheduleRefit();
}
let refitTimer = null;
function scheduleRefit() { clearTimeout(refitTimer); refitTimer = setTimeout(() => { fitModel(false); S.plan = null; if (S.view === "home") render(); }, 400); }
function scrollToEnd() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  requestAnimationFrame(() => document.querySelector(".thread-end")?.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "end" }));

    if (i < 0) pool.sources.push(s); else if (s.msgs && !pool.sources[i].msgs) pool.sources[i] = s;
  }
  const byId = new Map(pool.items.map(i => [i.id, i])), haveJa = new Set(pool.items.map(i => i.ja));
  for (const it of p2.items) {
    if (!it || !it.id || !it.ja) continue;
    const old = byId.get(it.id);
    if (old) { if (it.src && !old.src) { old.src = it.src; old.mi = it.mi; } continue; }
    if (haveJa.has(it.ja)) continue;
    pool.items.push(it); haveJa.add(it.ja);

}

  for (const c of allCards()) {
    if (have.has(c.id) || !c.last) continue;
    const s = c.reps === 0 && c.lapses > 0 ? 0.3 : Math.max(0.3, c.ivl || 1);
    if (c.created && startOfDay(c.created) !== startOfDay(c.last)) S.log.push({ id: c.id, t: c.created, k: "seen" });
    S.log.push({ id: c.id, t: c.last, k: "init", s, l: c.lapses || 0 });
    n++;
  }
  if (n) S.log.sort((a, b) => a.t - b.t);
  return n;
}
async function importBackup(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== "talk-eisaku" || !data.cards || typeof data.cards !== "object") throw 0;
    let n = 0;
    for (const [id, c] of Object.entries(data.cards)) {
      if (!c || typeof c !== "object" || !c.ja || !c.en) continue;
      const l = S.cards[id];
      if (!l || (c.last || 0) > (l.last || 0)) { S.cards[id] = c; n++; }
    }
    if (Array.isArray(data.log)) {
      const keyOf = e => e.id + "|" + e.t + "|" + e.k, have = new Set(S.log.map(keyOf));
      for (const e of data.log) if (e && e.id && e.t && e.k && !have.has(keyOf(e))) { S.log.push(e); have.add(keyOf(e)); }
      S.log.sort((a, b) => a.t - b.t);
    }
    convertLegacy();
    if (data.pool) mergePool(data.pool);
    if (data.settings && typeof data.settings === "object") { Object.assign(S.settings, data.settings); persistSettings(); }
    fitModel(true); saveCards(); saveLog(); S.plan = null;
    toast(`バックアップから${n.toLocaleString()}件の学習記録を復元しました。`); go("home");
  } catch { toast("バックアップファイルとして読み取れませんでした。"); }
}

/* ============ 起動 ============ */
async function boot() {
  const st = LS.get(K.settings); if (st) Object.assign(S.settings, st);
  const mem = LS.get(K.mem); if (mem) Object.assign(S.mem, mem);
  render();
  await Store.init();
  let [pool, cards, log] = await Promise.all([Store.get("pool"), Store.get("cards"), Store.get("log")]);
  Store.del("skips"); // 以前の版で保存した「飛ばした発言」の記録を消す
  let migrated = false;
  if (!pool) { const p = LS.get(K.oldPool); if (p && Array.isArray(p.items)) { pool = p; migrated = true; } }
  if (!cards) { const c = LS.get(K.oldCards); if (c && typeof c === "object") { cards = c; migrated = true; } }
  S.pool = pool || null; S.cards = cards || {}; S.log = Array.isArray(log) ? log : [];
  indexPool();
  const converted = convertLegacy();
  let cleaned = 0;
  for (const c of allCards()) {
    const en = c.en && speakable(c.en), alts = (c.alts || []).map(speakable), ph = c.ph && speakable(c.ph);
    if (en !== c.en || ph !== c.ph || alts.some((a, i) => a !== c.alts[i])) { c.en = en; c.alts = alts; c.ph = ph; cleaned++; }
  }
  if (cleaned) saveCards();
  replayAll();
  S.ready = true; render();
  if (migrated || converted) {
    const ok = [await Store.set("pool", S.pool), await Store.set("cards", S.cards), await Store.set("log", S.log)].every(x => x !== false);
    if (ok && migrated) { LS.del(K.oldPool); LS.del(K.oldCards); }
  }
  setTimeout(() => { fitModel(false); S.plan = null; if (S.view === "home") render(); }, 300);
}
TTS.init();
boot();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
