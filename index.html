<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トーク英作</title>
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #EDF0F5;
  --surface: #FFFFFF;
  --ink: #1B2232;
  --muted: #5F6B80;
  --line: #D5DBE5;
  --me: #3445A5;
  --on-me: #FFFFFF;
  --me-soft: #E1E6FA;
  --ok: #1E8758;
  --close: #A86A12;
  --ng: #C23A2E;
  --ok-soft: #DDF2E7;
  --close-soft: #F7EBD6;
  --ng-soft: #F8E0DD;
  --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #11141D; --surface: #1A1F2C; --ink: #E6E9F1; --muted: #9AA3B5; --line: #2A3142;
    --me: #4B5FD0; --on-me: #FFFFFF; --me-soft: #252E52;
    --ok: #4CC08B; --close: #E0A84A; --ng: #F07A6E;
    --ok-soft: #173327; --close-soft: #3A2C15; --ng-soft: #3D1D1A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #11141D; --surface: #1A1F2C; --ink: #E6E9F1; --muted: #9AA3B5; --line: #2A3142;
  --me: #4B5FD0; --on-me: #FFFFFF; --me-soft: #252E52;
  --ok: #4CC08B; --close: #E0A84A; --ng: #F07A6E;
  --ok-soft: #173327; --close-soft: #3A2C15; --ng-soft: #3D1D1A;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.7; -webkit-tap-highlight-color: transparent; }
#app { max-width: 560px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
.view { flex: 1; display: flex; flex-direction: column; padding: 0 16px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--me); outline-offset: 2px; }
img, svg { max-width: 100%; }
a { color: var(--me); }

/* top bar */
.bar { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.bar h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: .02em; flex: 1; }
.bar .grow { flex: 1; }
.link { background: none; border: 0; padding: 8px 10px; border-radius: 10px; color: var(--me); font-weight: 500; }
.link:active { background: var(--me-soft); }

/* chat */
.date-chip { align-self: center; margin: 8px 0 4px; padding: 2px 12px; border-radius: 999px; background: var(--line); color: var(--muted); font-size: .8125rem; }
.row { display: flex; flex-direction: column; margin: 10px 0; }
.row.me { align-items: flex-end; }
.row.them { align-items: flex-start; }
.who { font-size: .8125rem; color: var(--muted); margin: 0 0 2px 6px; }
.bubble { max-width: 84%; padding: 10px 14px; border-radius: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.them { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.bubble.mine { background: var(--me); color: var(--on-me); border-bottom-right-radius: 6px; font-size: 1.125rem; font-weight: 500; line-height: 1.6; }
.bubble.en { background: var(--me-soft); font-family: var(--serif); font-size: 1.1875rem; line-height: 1.45; border-bottom-right-radius: 6px; }
.under { font-size: .8125rem; color: var(--muted); margin: 4px 6px 0; }
.coach { width: 100%; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; border-bottom-left-radius: 6px; padding: 14px 16px 16px; }
.coach p { margin: 0; }
.coach .sec { margin-top: 14px; }
.coach .lbl { font-size: .8125rem; color: var(--muted); margin-bottom: 2px; }
.en-line { display: flex; align-items: flex-start; gap: 10px; }
.en-line .txt { flex: 1; font-family: var(--serif); }
.model { font-size: 1.4375rem; line-height: 1.35; font-weight: 500; }
.alt { font-size: 1.125rem; line-height: 1.4; }
.alt + .alt { margin-top: 6px; }
.phrase { font-family: var(--serif); font-style: italic; font-size: 1.0625rem; }
.verdict { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 2px 12px; border-radius: 999px; font-size: .9375rem; }
.verdict.correct { color: var(--ok); background: var(--ok-soft); }
.verdict.close { color: var(--close); background: var(--close-soft); }
.verdict.wrong { color: var(--ng); background: var(--ng-soft); }
.typing { display: inline-flex; gap: 5px; align-items: center; height: 24px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* round icon buttons */
.icon-btn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--me); display: grid; place-items: center; padding: 0; }
.icon-btn:active { background: var(--me-soft); }
.icon-btn svg { width: 20px; height: 20px; }

/* composer */
.composer { position: sticky; bottom: 0; margin: 12px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.ask-row { display: flex; gap: 10px; align-items: flex-end; }
.ask-row textarea { flex: 1; min-height: 52px; max-height: 9em; resize: none; padding: 13px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-family: var(--serif); font-size: 1.125rem; line-height: 1.4; }
.ask-row textarea::placeholder { font-family: var(--sans); font-size: .9375rem; color: var(--muted); }
.mic { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--me); background: var(--surface); color: var(--me); display: grid; place-items: center; padding: 0; position: relative; }
.mic svg { width: 24px; height: 24px; }
.mic.on { background: var(--ng); border-color: var(--ng); color: #fff; }
.mic.on::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--ng); animation: ring 1.4s infinite ease-out; }
@keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
.btn-row { display: flex; gap: 10px; margin-top: 10px; }
.btn { min-height: 52px; border-radius: 14px; border: 0; padding: 0 18px; font-weight: 700; font-size: 1rem; }
.btn.primary { background: var(--me); color: var(--on-me); }
.btn-row .btn.primary { flex: 1; }
.btn.primary:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--me); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.hint { font-size: .8125rem; color: var(--muted); margin: 8px 2px 0; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: .9375rem; }
.seg button[aria-pressed="true"].correct { background: var(--ok); border-color: var(--ok); color: #fff; }
.seg button[aria-pressed="true"].close { background: var(--close); border-color: var(--close); color: #fff; }
.seg button[aria-pressed="true"].wrong { background: var(--ng); border-color: var(--ng); color: #fff; }
.seg button[aria-pressed="true"].plain { background: var(--me); border-color: var(--me); color: var(--on-me); }
.next-due { font-size: .875rem; color: var(--muted); margin: 8px 2px 0; }
.natural { margin-top: 14px; padding: 10px 12px 12px; border-radius: 14px; background: var(--me-soft); }
.natural .txt { font-family: var(--serif); font-size: 1.25rem; line-height: 1.4; font-weight: 500; }
.coach .natural .why { font-size: .875rem; margin-top: 6px; }
.coach .already { margin-top: 10px; font-size: .875rem; color: var(--ok); }

/* quiz header */
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 0 0 4px; }
.progress span { display: block; height: 100%; background: var(--me); transition: width .3s; }
.count { font-size: .875rem; color: var(--muted); }
.kind { font-size: .8125rem; padding: 1px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.thread { flex: 1; display: flex; flex-direction: column; padding-bottom: 8px; }

/* home */
.hero { padding: 20px 0 8px; display: flex; flex-direction: column; }
.hero .bubble.mine { font-size: 1.3125rem; max-width: 90%; }
.hero .prompt { align-self: flex-end; color: var(--muted); font-size: .9375rem; margin: 6px 4px 0; }
.today { font-size: 1.0625rem; margin: 18px 0 12px; }
.today b { font-weight: 700; }
section { padding: 20px 0; border-top: 1px solid var(--line); }
section h2 { margin: 0 0 12px; font-size: 1rem; font-weight: 700; }
.fc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 96px; }
.fc .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.fc .n { font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.fc .b { width: 100%; max-width: 32px; border-radius: 6px 6px 2px 2px; background: var(--me-soft); min-height: 3px; }
.fc .col.now .b { background: var(--me); }
.fc .d { font-size: .75rem; color: var(--muted); }
.item { padding: 12px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .ja { font-size: .9375rem; color: var(--muted); white-space: pre-wrap; }
.item .meta { font-size: .8125rem; color: var(--muted); margin-top: 4px; }
.item .en-line .txt { font-size: 1.1875rem; line-height: 1.4; }
.note { font-size: .875rem; color: var(--muted); }
.banner { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--close-soft); color: var(--ink); font-size: .9375rem; }
.foot { padding: 16px 0 28px; font-size: .8125rem; color: var(--muted); }
.empty { padding: 28px 0; color: var(--muted); }

/* setup */
.intro { padding: 28px 0 8px; }
.intro .title { font-size: 2rem; font-weight: 700; line-height: 1.3; margin: 0 0 10px; color: var(--ink); }
.intro p { margin: 0; color: var(--muted); }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
ol.steps li { counter-increment: s; position: relative; padding: 0 0 16px 40px; }
ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--me-soft); color: var(--me); font-weight: 700; display: grid; place-items: center; font-size: .875rem; }
.file-btn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.file-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.file-help { font-size: .8125rem; color: var(--muted); margin: 10px 2px 0; }
label.field { display: block; margin: 0 0 6px; font-weight: 500; }
select, .text-in { width: 100%; min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.row-set { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch { width: 52px; height: 32px; border-radius: 999px; border: 0; background: var(--line); position: relative; padding: 0; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--me); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
input[type="range"] { width: 100%; accent-color: var(--me); }
.danger, .btn.danger { color: var(--ng); }

.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(520px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: .9375rem; z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .typing i, .mic.on::after { animation: none; }
  .progress span, .switch::after { transition: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ 基本ユーティリティ ============ */
const DAY = 86400000;
const pad2 = n => String(n).padStart(2, "0");
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const len = s => Array.from(s).length;
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const smart = s => String(s || "").replace(/(\w)'(\w)/g, "$1\u2019$2").replace(/(^|[\s(])"([^"]+)"/g, "$1\u201C$2\u201D").replace(/(^|[\s(])'([^']+)'/g, "$1\u2018$2\u2019");
function fmtDate(d) { if (!d) return ""; const [y, m, dd] = d.split("-"); return `${y}年${+m}月${+dd}日`; }
function fmtMD(t) { const d = new Date(t); return `${d.getMonth() + 1}月${d.getDate()}日`; }
function relDays(n) { if (n <= 0) return "今日"; if (n === 1) return "明日"; if (n < 30) return `${n}日後`; if (n < 365) return `約${Math.round(n / 30)}か月後`; return "約1年後"; }

const ICON = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  speak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
};

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v; // 固定のSVGアイコン専用
    else if (k === "value") el.value = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}

let toastTimer = null;
function toast(msg, ms = 3800) {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), ms);
}

/* ============ ブラウザ保存（この端末） ============ */
const K = { pool: "tk.pool.v1", cards: "tk.cards.v1", settings: "tk.settings.v1" };
const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};

/* ============ 状態 ============ */
const S = {
  view: "home",
  pool: null,            // { sources:[{partner, me, count, at}], items:[{id,d,ja,ctx,cn}] }
  poolIndex: new Map(),
  cards: {},             // id -> カード（学習記録）
  settings: { newPerDay: 10, rate: 0.95, autoSpeak: true, model: "claude-haiku-5-5" },
  ready: false,
  sample: null, perms: null,
  db: null, uid: null, storage: "local",
  plan: null, session: null, setup: null,
  micBlocked: false
};

/* ============ LINEトーク履歴の読み込み ============ */
function cyrb53(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, "0") + (h1 >>> 0).toString(16).padStart(8, "0");
}
function parseLineExport(raw) {
  const lines = raw.replace(/^\uFEFF/, "").split(/\r\n|\n|\r/);
  const head = /^\[LINE\]\s*(.+?)とのトーク履歴/.exec(lines[0] || "");
  const partner = head ? head[1].trim() : null;
  const reDate = /^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})(\(.{1,3}\)|\s+\S{1,4})?\s*$/;
  const reMsg = /^(\d{1,2}):(\d{2})\t(.*)$/;
  const msgs = [];
  let date = null, cur = null;
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (i < 3 && (/^\[LINE\]/.test(ln) || /^保存日時/.test(ln))) continue;
    let m;
    if ((m = reDate.exec(ln))) { date = `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`; cur = null; continue; }
    if ((m = reMsg.exec(ln))) {
      const rest = m[3].split("\t");
      const named = rest.length >= 2;
      cur = { d: date, t: `${pad2(m[1])}:${m[2]}`, name: named ? rest[0].trim() : "", text: named ? rest.slice(1).join("\t") : rest[0] };
      msgs.push(cur);
      continue;
    }
    if (cur) cur.text += "\n" + ln;
  }
  for (const m of msgs) {
    let t = m.text.replace(/\s+$/, "");
    if (t.length > 1 && t.startsWith('"') && t.endsWith('"') && t.includes("\n")) t = t.slice(1, -1).replace(/""/g, '"');
    m.text = t;
  }
  const speakers = {};
  for (const m of msgs) if (m.name) speakers[m.name] = (speakers[m.name] || 0) + 1;
  return { partner, msgs, speakers };
}
const RE_MEDIA = /^\[[^\]\n]{1,20}\]$/;
const RE_SYSTEM = /通話をキャンセル|通話時間|不在着信|送信を取り消し|☎|がメッセージの送信|アルバム.*(作成|追加)|ノートに投稿/;
function cleanText(t) {
  t = t.trim();
  if (!t || RE_MEDIA.test(t) || /https?:\/\//.test(t) || RE_SYSTEM.test(t)) return null;
  if (t.split("\n").length > 3 || len(t) > 80) return null;
  const core = t.replace(/[\s笑ｗwW!！?？。、,.…・〜~ー\-()（）「」『』]/g, "").replace(/\p{Extended_Pictographic}/gu, "");
  const jp = (core.match(/[\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Han}]/gu) || []).length;
  if (jp < 5 || jp / Math.max(1, len(core)) < 0.6) return null;
  return t;
}
function buildItems(msgs, me) {
  const items = [], seen = new Set();
  for (let i = 0; i < msgs.length; i++) {
    const m = msgs[i];
    if (m.name !== me) continue;
    const ja = cleanText(m.text);
    if (!ja || seen.has(ja)) continue;
    seen.add(ja);
    let ctx = null, cn = null;
    for (let j = i - 1; j >= Math.max(0, i - 4); j--) {
      const p = msgs[j];
      if (p.d !== m.d) break;
      if (!p.name || p.name === me) continue;
      const pt = p.text.trim();
      if (RE_MEDIA.test(pt) || RE_SYSTEM.test(pt)) continue;
      ctx = Array.from(pt).slice(0, 120).join(""); cn = p.name; break;
    }
    items.push({ id: cyrb53(m.d + "|" + m.t + "|" + ja), d: m.d, ja, ctx, cn });
  }
  return items;
}
function indexPool() { S.poolIndex = new Map((S.pool?.items || []).map(it => [it.id, it])); }
function savePool() {
  if (!S.pool) { LS.del(K.pool); return; }
  if (!LS.set(K.pool, S.pool)) toast("トーク履歴をこの端末に保存できませんでした。次に開いたときは、もう一度読み込んでください。", 6000);

function addSource(partner, me, items) {

  let added = 0;

/* ============ 復習タイミング（間隔反復） ============ */
function newCard(item) {
  return { id: item.id, ja: item.ja, d: item.d || null, en: null, alts: [], tip: null, ph: null, phj: null,
    ease: 2.5, ivl: 0, reps: 0, lapses: 0, due: 0, last: 0, created: Date.now(), hist: [], ans: null };
}
// wrong: 10分後にもう一度 → 正解で1日後 → 3日後 → 間隔×易しさ…
// 初見で正解したものは4日後から
function schedule(card, verdict, now = Date.now()) {
  const c = { ...card, hist: [...(card.hist || []), verdict].slice(-8) };
  const first = !card.last;
  if (verdict === "wrong") {
    c.lapses = (card.lapses || 0) + 1; c.reps = 0; c.ease = Math.max(1.3, card.ease - 0.2); c.ivl = 0; c.due = now + 10 * 60000;
  } else {
    let ivl;
    if (verdict === "close") { c.ease = Math.max(1.3, card.ease - 0.15); ivl = card.reps === 0 ? 1 : Math.max(card.ivl + 1, Math.round(card.ivl * 1.2)); }
    else ivl = card.reps === 0 ? (first ? 4 : 1) : card.reps === 1 ? Math.max(3, Math.round(card.ivl * card.ease)) : Math.round(card.ivl * card.ease);
    if (ivl >= 7) ivl = Math.round(ivl * (0.92 + Math.random() * 0.16));
    ivl = Math.min(Math.max(1, ivl), 365);
    c.ivl = ivl; c.reps = card.reps + 1; c.due = startOfDay(now) + ivl * DAY;
  }
  c.last = now;
  return c;
}
const allCards = () => Object.values(S.cards);
const dueCards = (now = Date.now()) => allCards().filter(c => c.due <= now).sort((a, b) => (b.lapses - a.lapses) || (a.due - b.due));
const newToday = () => { const t = startOfDay(Date.now()); return allCards().filter(c => c.created >= t).length; };
function pickFresh(n) {
  if (n <= 0 || !S.pool) return [];
  const known = new Set(allCards().map(c => c.ja));
  const cand = S.pool.items.filter(it => !S.cards[it.id] && !known.has(it.ja));
  const good = cand.filter(it => { const L = len(it.ja); return L >= 7 && L <= 45; });
  const src = good.length >= n ? good : cand;
  const out = [], used = new Set();
  while (out.length < n && used.size < src.length) { const k = Math.floor(Math.random() * src.length); if (used.has(k)) continue; used.add(k); out.push(src[k]); }
  return out;
}
function makePlan(extra = 0) {
  const due = dueCards();
  const slots = extra || Math.max(0, S.settings.newPerDay - newToday());
  return { due: due.map(c => c.id), fresh: pickFresh(slots) };
}

/* ============ 採点（Claude API） ============ */
const MODELS = { "claude-haiku-5-5": "Claude Haiku 5.5（速い・安い）", "claude-sonnet-5-5": "Claude Sonnet 5.5（より丁寧）" };
async function callClaude(prompt, maxTokens = 2000) {
  const key = getKey();
  if (!key) throw { code: "no_key" };
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: MODELS[S.settings.model] ? S.settings.model : "claude-haiku-5-5",
        max_tokens: maxTokens,
        output_config: { effort: "low" },
        messages: [{ role: "user", content: prompt }]
      })
    });
  } catch (e) { throw { code: navigator.onLine === false ? "offline" : "network" }; }
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    const err = (data && data.error) || {};
    const msg = String(err.message || "");
    if (res.status === 401) throw { code: "invalid_key" };
    if (res.status === 403) throw { code: "permission" };
    if (res.status === 429) throw { code: "rate_limited" };
    if (res.status === 529 || res.status === 503 || err.type === "overloaded_error") throw { code: "overloaded" };
    if (/credit balance/i.test(msg)) throw { code: "credit" };
    if (res.status === 404 || err.type === "not_found_error" || /model/i.test(msg)) throw { code: "model" };
    throw { code: "upstream_error" };
  }
  if (data && data.stop_reason === "refusal") throw { code: "refused" };
  const text = ((data && data.content) || []).filter(b => b.type === "text").map(b => b.text).join("");
  const t = text.replace(/```(?:json)?/g, "").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b <= a) throw { code: "invalid_json" };
  try { return JSON.parse(t.slice(a, b + 1)); } catch { throw { code: "invalid_json" }; }
}
function buildPrompt(ja, answer, ref) {
  return [
    "You are an English coach for a Japanese adult. They practice saying their OWN real LINE messages (casual texts to a friend) in natural English.",
    "",
    "Japanese message they actually sent:",
    "<<<" + ja + ">>>",
    "",
    ref ? "Model answer they were shown before (keep it as the model answer unless it is clearly wrong or unnatural):\n<<<" + ref + ">>>\n" : "",
    "Their English attempt (it may come from speech recognition, so ignore capitalization, punctuation and obvious mishearings):",
    "<<<" + (answer || "(no attempt: they gave up and want to see the answer)") + ">>>",
    "",
    "Do this:",
    "1. model: the most natural casual English text a native speaker would send a friend with the same meaning and tone. Keep it short like a real text. Render 笑 / (笑) / w as lol or haha only where natural. Write Japanese names in romaji.",
    "2. alts: 1-2 other natural ways to say it, worded differently.",
    "3. verdict: judge ONLY whether the meaning gets across. \"correct\" if an English-speaking friend would understand what they meant, even if it is worded differently from the model, has grammar mistakes, or sounds unnatural. \"close\" if the main point comes through but an important part is missing or slightly off. \"wrong\" if the meaning does not come through, it is not English, or there is no attempt.",
    "4. feedback: 1-2 short sentences IN JAPANESE about whether the meaning came through (and which part was missing or off, if any). Do not comment on grammar or naturalness here. If there is no attempt, explain the key point of the model answer.",
    "5. natural: if native speakers would more typically say what the learner said in a different way, write that version. Stay as close as possible to the learner's own wording and change only what natives would phrase differently. Natural means what natives actually prefer to say in casual texts, NOT grammatical correctness: do not change something only to fix grammar if natives commonly say it that way (dropped subjects, fragments and contractions are fine), and a grammatically perfect sentence can still be unnatural. Use an empty string if the attempt already sounds like what a native would text, if the verdict is wrong, or if there is no attempt.",
    "6. natural_why: if natural is not empty, 1 short sentence IN JAPANESE on why natives prefer it (for example, which word sounds stiff or textbook-like and what natives say instead). Otherwise an empty string.",
    "7. phrase: one reusable expression from the model answer; phrase_ja: its meaning in Japanese.",
    "",
    "Reply with only JSON like:",
    '{"model":"...","alts":["..."],"verdict":"correct","feedback":"...","natural":"...","natural_why":"...","phrase":"...","phrase_ja":"..."}'

}
async function grade(ja, answer, ref) {

    verdict: ["correct", "close", "wrong"].includes(r.verdict) ? r.verdict : "close",

function teachPrompt(ja) {

/* ============ セッション ============ */
function startSession(plan) {
  const p = plan || makePlan();
  const fresh = new Map(p.fresh.map(it => [it.id, it]));
  const queue = [...p.due, ...p.fresh.map(it => it.id)];
  if (!queue.length) return;
  S.session = { queue, fresh, total: queue.length, seen: {}, first: {}, missed: [], phase: "ask", cur: null, answer: "", result: null, error: null, kind: "" };
  nextQuestion();
}
function nextQuestion() {
  const ss = S.session;
  if (!ss.queue.length) { S.view = "done"; render(); return; }
  const id = ss.queue.shift();
  ss.kind = ss.seen[id] ? "again" : S.cards[id] ? "review" : "new";
  ss.seen[id] = (ss.seen[id] || 0) + 1;
  Object.assign(ss, { cur: id, phase: ss.kind === "new" ? "learn-loading" : "ask", answer: "", result: null, lesson: null, error: null, giveUp: false });
  S.view = "quiz"; render(); window.scrollTo(0, 0);
  if (ss.kind === "new") loadLesson();
  prefetchNext();
}
const lessons = new Map();
function lessonFor(item) {
  if (!lessons.has(item.id)) lessons.set(item.id, teach(item.ja).catch(e => { lessons.delete(item.id); throw e; }));
  return lessons.get(item.id);
}
function prefetchNext() {
  const ss = S.session, nid = ss && ss.queue[0];
  if (!nid || S.cards[nid] || ss.seen[nid]) return;
  const it = ss.fresh.get(nid);
  if (it) lessonFor(it).catch(() => {});
}
async function loadLesson() {
  const ss = S.session, id = ss.cur, base = baseCard(id);
  ss.phase = "learn-loading"; ss.error = null; render();
  try {
    const res = await lessonFor(base);
    if (S.session !== ss || ss.cur !== id) return;
    ss.lesson = { ...base, en: res.model, alts: res.alts, tip: res.point, ph: res.phrase, phj: res.phrase_ja };
    ss.phase = "learn"; render(); scrollToEnd();
    if (S.settings.autoSpeak) TTS.speak(res.model, true);
  } catch (e) {
    if (S.session !== ss || ss.cur !== id) return;
    ss.phase = "error"; ss.error = (e && e.code) || "upstream_error"; render(); scrollToEnd();
  }
}
// 「覚えた」→ 翌日に英作文として初出題（正解するたびに3日後、約1週間後…と間隔が伸びる）
function learned() {
  const ss = S.session, c0 = ss && ss.lesson;
  if (!c0) return;
  const now = Date.now();
  const c = { ...c0, created: now, last: now, reps: 1, ivl: 1, due: startOfDay(now) + DAY, hist: ["learned"] };
  S.cards[c.id] = c; persistCard(c);
  if (!ss.first[c.id]) ss.first[c.id] = "learned";
  ss.lesson = null;
}
const baseCard = id => S.cards[id] || newCard(S.session.fresh.get(id) || S.poolIndex.get(id));
async function check(giveUp) {
  const ss = S.session, id = ss.cur, base = baseCard(id);
  const answer = giveUp ? "" : ss.answer.trim();
  if (!giveUp && !answer) return;
  stopListening();
  ss.giveUp = giveUp; ss.shown = answer; ss.phase = "grading"; ss.error = null;
  render(); scrollToEnd();
  if (giveUp && base.en) { reveal(base, { model: base.en, alts: base.alts, verdict: "wrong", feedback: "", phrase: base.ph, phrase_ja: base.phj }); return; }
  try {
    const res = await grade(base.ja, answer, base.en);
    if (S.session !== ss || ss.cur !== id) return;
    reveal(base, res);
  } catch (e) {
    if (S.session !== ss || ss.cur !== id) return;
    ss.phase = "error"; ss.error = (e && e.code) || "upstream_error"; render(); scrollToEnd();
  }
}
function reveal(base, res) {
  const ss = S.session;
  const verdict = ss.giveUp ? "wrong" : res.verdict;
  const card = { ...base, en: res.model || base.en, alts: res.alts && res.alts.length ? res.alts : base.alts || [],
    tip: res.feedback || base.tip, ph: res.phrase || base.ph, phj: res.phrase_ja || base.phj, ans: ss.giveUp ? null : ss.shown };
  const now = Date.now();
  ss.result = { res, card, chosen: verdict, auto: verdict, options: { correct: schedule(card, "correct", now), close: schedule(card, "close", now), wrong: schedule(card, "wrong", now) } };
  ss.phase = "result"; render(); scrollToEnd();

}
function commit() {
  const ss = S.session, r = ss && ss.result;
  if (!r) return;
  const final = r.options[r.chosen];
  S.cards[final.id] = final; persistCard(final);
  if (!ss.first[final.id]) ss.first[final.id] = r.chosen;
  if (r.chosen === "wrong") {
    if (!ss.missed.includes(final.id)) ss.missed.push(final.id);
    if (ss.seen[final.id] < 3) ss.queue.splice(Math.min(3, ss.queue.length), 0, final.id);

}

  const hadAny = S.session && Object.keys(S.session.first).length;

  render();
}
function scrollToEnd() {

  requestAnimationFrame(() => document.querySelector(".thread-end")?.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "end" }));

  const segBtn = (n) => h("button", { class: "plain", type: "button", "aria-pressed": String(st.newPerDay === n), onclick: () => { st.newPerDay = n; persistSettings(); S.plan = null; render(); } }, `${n}問`);
  const rateLbl = h("span", { class: "note" }, `${st.rate.toFixed(2)}倍`);
  const sw = h("button", { class: "switch", type: "button", role: "switch", "aria-checked": String(st.autoSpeak), "aria-label": "お手本を自動で読み上げる",
    onclick: () => { st.autoSpeak = !st.autoSpeak; sw.setAttribute("aria-checked", String(st.autoSpeak)); persistSettings(); } });
  const resetBtn = h("button", { class: "btn ghost block danger", type: "button", onclick: () => {
    if (!resetArmed) { resetArmed = true; resetBtn.textContent = "もう一度タップすると、すべての学習記録を消去します"; setTimeout(() => { resetArmed = false; if (resetBtn.isConnected) resetBtn.textContent = "学習記録を消去する"; }, 4000); return; }
    resetArmed = false; S.cards = {}; LS.del(K.cards); S.plan = null; toast("学習記録を消去しました。"); go("home");
  } }, "学習記録を消去する");
  const fileBtn = h("label", { class: "btn ghost block file-btn" }, "トーク履歴を追加する",
    h("input", { type: "file", onchange: e => onFile(e.target.files && e.target.files[0]) }));

  const keyIn = h("input", { class: "text-in", id: "key", type: "password", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "sk-ant-…", value: getKey(),
    onchange: e => { setKey(e.target.value.trim()); S.plan = null; toast(getKey() ? "APIキーを保存しました。" : "APIキーを削除しました。"); } });
  const showBtn = h("button", { class: "link", type: "button", onclick: () => { const pw = keyIn.type === "password"; keyIn.type = pw ? "text" : "password"; showBtn.textContent = pw ? "隠す" : "表示"; } }, "表示");
  const modelSel = h("select", { id: "model", onchange: e => { st.model = e.target.value; persistSettings(); } },
    Object.entries(MODELS).map(([id, label]) => h("option", { value: id, selected: st.model === id }, label)));
  const testBtn = h("button", { class: "btn ghost block", type: "button", onclick: async () => {
    setKey(keyIn.value.trim());
    testBtn.disabled = true; testBtn.textContent = "確認しています…";
    try { await callClaude('Reply with only this JSON: {"ok":true}', 400); toast("接続できました。お手本と採点が使えます。"); }
    catch (e) { toast(errorCopy(e && e.code), 7000); }
    finally { testBtn.disabled = false; testBtn.textContent = "接続テスト"; }
  } }, "接続テスト");
  const importBtn = h("label", { class: "btn ghost block file-btn", style: "margin-top:10px" }, "バックアップから復元する",
    h("input", { type: "file", onchange: e => importBackup(e.target.files && e.target.files[0]) }));
  const note = (text, last) => h("p", { class: "note", style: last ? "margin:0" : "margin:0 0 6px" }, text);

  return h("div", { class: "view" },
    h("div", { class: "bar" }, h("button", { class: "link", style: "padding-left:0", type: "button", onclick: () => go("home") }, "戻る"), h("h1", { style: "font-size:1.0625rem" }, "設定")),
    h("section", { style: "border-top:0;padding-top:4px" }, h("h2", null, "Claude APIキー"),
      h("div", { class: "row-set" }, h("label", { class: "field", for: "key", style: "margin:0" }, "APIキー"), showBtn),
      keyIn,
      h("p", { class: "note", style: "margin:8px 0 0" }, "APIキーは ", h("a", { href: "https://platform.claude.com/", target: "_blank", rel: "noopener" }, "Claude Console"),
        " で作成できます。キーはこの端末にだけ保存され、Anthropic以外には送られません。"),
      h("label", { class: "field", for: "model", style: "margin-top:16px" }, "使うモデル"), modelSel,
      h("div", { style: "margin-top:12px" }, testBtn)),
    h("section", null, h("h2", null, "1日の新しい問題"), h("div", { class: "seg" }, [5, 10, 20, 30].map(segBtn))),
    h("section", null,
      h("div", { class: "row-set" }, h("h2", { style: "margin:0" }, "読み上げの速さ"), rateLbl),
      h("input", { type: "range", min: "0.6", max: "1.2", step: "0.05", value: String(st.rate), "aria-label": "読み上げの速さ",
        oninput: e => { st.rate = +e.target.value; rateLbl.textContent = `${st.rate.toFixed(2)}倍`; }, onchange: persistSettings }),
      h("button", { class: "link", style: "padding-left:0", type: "button", onclick: () => TTS.speak("Hey, are you free this weekend?") }, "試しに聞く"),
      h("div", { class: "row-set", style: "margin-top:12px" }, h("span", null, "お手本を自動で読み上げる"), sw)),
    h("section", null, h("h2", null, "トーク履歴"),
      S.pool && S.pool.sources.length
        ? S.pool.sources.map(s => note(`${s.partner} とのトーク（${s.me}として、${s.count.toLocaleString()}問）`))
        : note("読み込まれていません。"),
      h("div", { style: "margin-top:10px" }, fileBtn),
      S.pool ? h("button", { class: "link danger", style: "padding-left:0;margin-top:6px", type: "button", onclick: () => { S.pool = null; indexPool(); savePool(); S.plan = null; toast("読み込んだトーク履歴を削除しました。学習記録は残っています。"); render(); } }, "読み込んだトーク履歴を削除する") : null),
    h("section", null, h("h2", null, "バックアップ"),
      h("p", { class: "note", style: "margin:0 0 10px" }, "学習記録とトーク履歴は、この端末のブラウザにだけ保存されます。機種変更やブラウザのデータ削除に備えて、ときどき保存しておくと安心です。APIキーは含まれません。"),
      h("button", { class: "btn ghost block", type: "button", onclick: exportBackup }, "バックアップを保存する"),
      importBtn),
    h("section", null, h("h2", null, "データの扱い"),
      note("トーク履歴と学習記録は、この端末にだけ保存されます。相手の発言は外に送られません。"),
      note("お手本や採点を作るときは、問題文（あなたの発言）とあなたの回答だけが、AnthropicのClaude APIに送られます。", true)),
    h("section", null, resetBtn),
    h("div", { style: "height:24px" }));
}

/* ============ 起動 ============ */
function loadLocal() {
  const pool = LS.get(K.pool); if (pool && Array.isArray(pool.items)) { S.pool = pool; indexPool(); }
  const cards = LS.get(K.cards); if (cards && typeof cards === "object") S.cards = cards;
  const st = LS.get(K.settings); if (st) Object.assign(S.settings, st);
}
loadLocal();
S.ready = true;
TTS.init();
render();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
