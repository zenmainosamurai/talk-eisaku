# 身内用の Web 版（web ブランチ）を GitHub Pages に公開する。web ブランチに push すると動く
# 初回だけ、GitHub の Settings → Pages → Build and deployment の Source を「GitHub Actions」にする
name: Deploy web to GitHub Pages

on:
  push:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Supabase の接続先と公開用のキー（publishable key）。ビルドしたアプリにそのまま入るもので、秘密ではない
          VITE_SUPABASE_URL: https://qhpoqzmlfnaerxyrsada.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_U-kk2ZsnNFssufpfqBB9FQ_q3Hj_W6Q
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
